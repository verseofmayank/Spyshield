[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spyshield"
version = "1.0.0"
description = "SpyShield: host-based intrusion detection and endpoint monitoring (defensive, read-only)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mayank Kumar Karn" }]
dependencies = ["psutil>=5.9", "watchdog>=4.0", "PyYAML>=6.0", "rich>=13.7", "click>=8.1", "Jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
spyshield = "spyshield.cli:main"

[tool.setuptools.packages.find]
include = ["spyshield*"]

[tool.setuptools.package-data]
spyshield = ["reporting/*.j2"]
